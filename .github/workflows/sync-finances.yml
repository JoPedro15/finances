name: Finance Weekly Sync

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: portfolio-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Execute Full Portfolio Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Full Portfolio Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_SERVICE_ACCOUNT_FILE: 'secrets/service_account.json'
          GDRIVE_CONFIG_FOLDER_ID: ${{ secrets.GDRIVE_CONFIG_FOLDER_ID }}
          GDRIVE_DATABASE_FOLDER_ID: ${{ secrets.GDRIVE_DATABASE_FOLDER_ID }}
          GDRIVE_REPORTS_FOLDER_ID: ${{ secrets.GDRIVE_REPORTS_FOLDER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          mkdir -p secrets
          if [ -n "$GDRIVE_SERVICE_ACCOUNT_JSON" ]; then
            echo "$GDRIVE_SERVICE_ACCOUNT_JSON" > secrets/service_account.json
          else
            echo "Warning: GDRIVE_SERVICE_ACCOUNT_JSON is not set or empty."
          fi
          make update-finances

      - name: Commit updated database and reports
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(portfolio): update history and decision metrics [skip ci]'
          file_pattern: 'data/finances.db output/*'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
