name: Stock Dip Alert Schedule

on:
  schedule:
    # Runs Monday to Friday at 21:00 UTC
    - cron: '0 21 * * 1-5'
  workflow_dispatch:
    inputs:
      min_drop_pct:
        description: 'Minimum drop percentage'
        required: false
        default: '5.0'
      max_drop_pct:
        description: 'Maximum drop percentage'
        required: false
        default: '15.0'

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: make install

      - name: Run Dip Detector and Send Alert
        env:
          MIN_DROP_PCT: ${{ github.event.inputs.min_drop_pct || '5.0' }}
          MAX_DROP_PCT: ${{ github.event.inputs.max_drop_pct || '10.0' }}
          SMTP_SERVER: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DEST_EMAIL: ${{ secrets.SMTP_USER }}
        run: python main.py check-dips