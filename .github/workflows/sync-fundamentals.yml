name: Sync Portfolio Fundamentals

on:
  schedule:
    # Run every Sunday at midnight (UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: sync-portfolio-fundamentals
  cancel-in-progress: false

jobs:
  sync-fundamentals:
    name: Execute Fundamental Data Sync
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Synchronize stock fundamental history
        run: python main.py sync-fundamentals

      # Placeholder for upcoming ETF synchronization requirement
      # - name: Synchronize ETF fundamental history
      #   run: python main.py sync-etf-fundamentals

      - name: Commit and push updated database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(db): update portfolio fundamental history [skip ci]'
          file_pattern: 'data/finances.db'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'