name: Weekly Portfolio Pipeline

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: portfolio-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Execute Full Portfolio Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Sequential Portfolio Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py sync-fundamentals
          python main.py save-snapshot
          python main.py analyze-quality
          python main.py opportunity_evaluation

      - name: Commit updated database and reports
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(portfolio): update history and decision metrics [skip ci]'
          file_pattern: 'data/finances.db output/*'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
